services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football-backend-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:nuntawat838@postgres:5432/football?sslmode=disable
      - REDIS_URL=redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=football-avatars
      - MINIO_PUBLIC_URL=http://localhost:9000/football-avatars
      - FOOTBALL_API_BASE_URL=https://v3.football.api-sports.io
      - FOOTBALL_API_KEY=5076833e29ee4201fce8a24ed9ec36ea
      - FOOTBALL_SEASON=2025
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:15-alpine
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nuntawat838
      POSTGRES_DB: football
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: football-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: football-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # MinIO S3 API Endpoint
      - "9001:9001"   # MinIO Web GUI Console (สำหรับดูรูปภาพบนเว็บ)
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
